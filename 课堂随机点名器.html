<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课堂随机点名器</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0b1220;
    background-image:
      radial-gradient(1200px 700px at 50% -10%, #1b2f5e 0%, rgba(11,18,32,0) 70%),
      radial-gradient(900px 600px at 100% 110%, #2a1b4d 0%, rgba(11,18,32,0) 70%);
    color: #e8eefc;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  body { display: grid; grid-template-rows: auto 1fr auto; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 26px;
  }
  .title {
    font-size: 22px; font-weight: 700; letter-spacing: .06em;
    color: #9fb4d8;
  }
  .tips { font-size: 16px; color: #5f7295; letter-spacing: .04em; }
  .topright { display: flex; align-items: center; gap: 16px; }
  .ghost.small { font-size: 15px; padding: 9px 16px; }

  /* ---------- 主舞台 ---------- */
  .stage {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 26px; padding: 0 4vw;
    min-height: 0;
  }
  .name {
    font-size: clamp(72px, 15vw, 210px);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: .04em;
    text-align: center;
    max-width: 100%;
    word-break: break-word;
    color: #eef4ff;
    text-shadow: 0 0 60px rgba(120,170,255,.25);
    transition: transform .12s ease-out;
  }
  .name.rolling { color: #7d8aa5; text-shadow: none; filter: blur(1.5px); }
  .name.hit {
    color: #ffd166;
    text-shadow: 0 0 40px rgba(255,209,102,.55), 0 0 120px rgba(255,140,60,.35);
    transform: scale(1.06);
  }
  .name.empty { font-size: clamp(64px, 9vw, 132px); color: #93a4c4; }

  .hint { font-size: 18px; color: #6b7f9f; height: 26px; letter-spacing: .05em; }

  /* ---------- 本轮已点名单 ---------- */
  .calledbar {
    display: flex; align-items: center; gap: 10px;
    padding: 0 26px 12px;
    overflow-x: auto; overflow-y: hidden;
    white-space: nowrap;
    scrollbar-width: thin;
  }
  .calledbar:empty { display: none; }
  .calledbar .label { flex: 0 0 auto; font-size: 15px; color: #6b7f9f; }
  .chip {
    flex: 0 0 auto; font-size: 16px; font-weight: 600;
    padding: 7px 15px; border-radius: 999px;
    color: #ffd166; background: rgba(255,209,102,.13);
    border: 1px solid rgba(255,209,102,.32);
  }
  .chip:hover { background: rgba(255,209,102,.26); }

  /* ---------- 底栏 ---------- */
  .bottom {
    display: flex; flex-direction: column;
    padding: 0 0 22px;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; padding: 0 26px;
  }
  .counter { font-size: 20px; color: #7c8fae; letter-spacing: .05em; white-space: nowrap; }
  .counter b { color: #ffd166; font-size: 26px; margin: 0 2px; }

  .controls { display: flex; align-items: center; gap: 14px; }

  button {
    font-family: inherit; cursor: pointer; border: 0; border-radius: 14px;
    transition: transform .1s, box-shadow .15s, background .15s;
  }
  button:active { transform: translateY(1px) scale(.99); }

  .primary {
    font-size: clamp(24px, 2.4vw, 34px); font-weight: 800;
    letter-spacing: .12em; padding: 20px 54px;
    color: #08111f;
    background: linear-gradient(180deg, #ffe08a, #f5b942);
    box-shadow: 0 10px 30px rgba(245,185,66,.32), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .primary.stop {
    color: #fff;
    background: linear-gradient(180deg, #ff7a6b, #e2402f);
    box-shadow: 0 10px 30px rgba(226,64,47,.35), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .ghost {
    font-size: 17px; padding: 13px 22px; color: #a9bbd8;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
  }
  .ghost:hover { background: rgba(255,255,255,.12); color: #e8eefc; }

  /* 重置按钮的「待确认」态：清空一整轮是不可撤销操作，得点两下 */
  .ghost.armed {
    color: #ffb3a3; background: rgba(255,110,90,.16);
    border-color: rgba(255,110,90,.55);
  }

  /* ---------- 弹窗 ---------- */
  .mask {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    background: rgba(4,8,16,.72); backdrop-filter: blur(4px);
    z-index: 50;
  }
  .mask.hidden { display: none; }
  .dialog {
    width: min(680px, 92vw); max-height: 88vh;
    display: flex; flex-direction: column; gap: 16px;
    padding: 26px; border-radius: 20px;
    background: #131d31; border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  .dialog h2 { margin: 0; font-size: 22px; letter-spacing: .05em; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field > span { font-size: 15px; color: #8fa3c4; }
  .field input, .field textarea {
    font-family: inherit; font-size: 17px; color: #e8eefc;
    background: #0b1424; border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px; padding: 12px 14px; outline: none;
    user-select: text; -webkit-user-select: text;
  }
  .field input:focus, .field textarea:focus { border-color: #f5b942; }
  .field textarea { height: 34vh; min-height: 160px; resize: vertical; line-height: 1.7; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 12px; }
  .dialog-actions .primary { font-size: 17px; padding: 12px 30px; letter-spacing: .08em; }
</style>
</head>
<body>

<div class="topbar">
  <div class="title" id="title">课堂随机点名</div>
  <div class="topright">
    <div class="tips">空格键 开始 / 停止</div>
    <button class="ghost small" id="btnFull">全屏投屏</button>
  </div>
</div>

<div class="stage">
  <div class="name" id="name">准备好了吗？</div>
  <div class="hint" id="hint">点下面的大按钮，或按一下空格键</div>
</div>

<div class="bottom">
  <div class="calledbar" id="calledBar"></div>
  <div class="row">
    <div class="counter">已点 <b id="called">0</b> / <span id="total">0</span></div>
    <div class="controls">
      <button class="primary" id="btnMain">开始点名</button>
      <button class="ghost" id="btnReset">重置本轮</button>
      <button class="ghost" id="btnEdit">编辑名单</button>
    </div>
  </div>
</div>

<div class="mask hidden" id="mask">
  <div class="dialog">
    <h2>编辑名单</h2>
    <label class="field">
      <span>标题（会显示在左上角，可写班级名）</span>
      <input id="inpTitle" maxlength="24">
    </label>
    <label class="field">
      <span>名单：每行一个名字，可从 Excel 整列粘贴；保存后会清空本轮已点记录</span>
      <textarea id="inpNames" spellcheck="false"></textarea>
    </label>
    <div class="dialog-actions">
      <button class="ghost" id="btnCancel">取消</button>
      <button class="primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var KEY = "random-caller-v1";
  var DEFAULT_TITLE = "课堂随机点名";
  var DEFAULT_NAMES = (function () {
    var a = [];
    for (var i = 1; i <= 45; i++) a.push((i < 10 ? "0" : "") + i + " 号");
    return a;
  })();

  var state = {
    title: DEFAULT_TITLE,
    names: DEFAULT_NAMES.slice(),
    called: [],          // 本轮已点到的名字
    rolling: false,
    timer: null
  };

  var $ = function (id) { return document.getElementById(id); };
  var elName = $("name"), elHint = $("hint"), elCalled = $("called"),
      elTotal = $("total"), elTitle = $("title"), elMain = $("btnMain"),
      elMask = $("mask"), elNames = $("inpNames"), elInpTitle = $("inpTitle"),
      elCalledBar = $("calledBar"), elReset = $("btnReset"), elFull = $("btnFull");

  // 「重置本轮」是清空整轮、不可撤销的操作，改成点两下才生效，防讲台上手滑
  var resetArmed = false, resetTimer = null;

  /* ---------- 公平随机：拒绝采样，避免取模偏差 ---------- */
  function randInt(n) {
    if (n <= 0) return 0;
    if (window.crypto && window.crypto.getRandomValues) {
      var max = Math.floor(4294967296 / n) * n;
      var buf = new Uint32Array(1), x;
      do { window.crypto.getRandomValues(buf); x = buf[0]; } while (x >= max);
      return x % n;
    }
    return Math.floor(Math.random() * n);
  }

  function pool() {
    var called = {};
    state.called.forEach(function (n) { called[n] = true; });
    return state.names.filter(function (n) { return !called[n]; });
  }

  /* ---------- 存储 ---------- */
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        title: state.title, names: state.names, called: state.called
      }));
    } catch (e) { /* file:// 下不可用时静默跳过 */ }
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && Array.isArray(d.names) && d.names.length) {
        state.title = d.title || DEFAULT_TITLE;
        state.names = d.names;
        state.called = Array.isArray(d.called)
          ? d.called.filter(function (n) { return state.names.indexOf(n) !== -1; })
          : [];
      }
    } catch (e) { /* 忽略损坏数据 */ }
  }

  /* ---------- 渲染 ---------- */
  function renderCounter() {
    elCalled.textContent = state.called.length;
    elTotal.textContent = state.names.length;
    elTitle.textContent = state.title;
    renderCalledBar();
  }

  // 本轮已点的名字一条条列出来，学生能看见、老师点一下就能撤回
  function renderCalledBar() {
    elCalledBar.innerHTML = "";
    if (!state.called.length) return;
    var lb = document.createElement("span");
    lb.className = "label";
    lb.textContent = "本轮已点（点名字可撤回）：";
    elCalledBar.appendChild(lb);
    state.called.forEach(function (n) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = n;
      b.title = "点一下，把「" + n + "」放回本轮名单";
      b.addEventListener("click", function () { undoCall(n); });
      elCalledBar.appendChild(b);
    });
    elCalledBar.scrollLeft = elCalledBar.scrollWidth;
  }

  function undoCall(name) {
    var i = state.called.indexOf(name);
    if (i === -1) return;
    state.called.splice(i, 1);
    renderCounter();
    var left = state.names.length - state.called.length;
    if (!state.rolling) {
      setHint(left > 0 ? "「" + name + "」已放回，还剩 " + left + " 位没被点到" : "「" + name + "」已放回");
    }
    save();
  }

  function setHint(text) { elHint.textContent = text || ""; }

  function showIdle() {
    elName.className = "name empty";
    elName.textContent = "准备好了吗？";
    setHint("点下面的大按钮，或按一下空格键");
  }

  function showExhausted() {
    elName.className = "name empty";
    elName.textContent = state.names.length + " 位同学都点过了";
    setHint("点「重置本轮」开始新一轮");
  }

  /* ---------- 主流程 ---------- */
  function startRolling() {
    disarmReset();
    var p = pool();
    if (!p.length) { showExhausted(); return; }
    state.rolling = true;
    elMain.textContent = "停";
    elMain.classList.add("stop");
    elName.className = "name rolling";
    setHint("再点一下（或按空格）停下来");
    state.timer = setInterval(function () {
      var q = pool();
      elName.textContent = q[randInt(q.length)];
    }, 55);
  }

  function stopRolling() {
    clearInterval(state.timer);
    state.timer = null;
    state.rolling = false;
    elMain.textContent = "开始点名";
    elMain.classList.remove("stop");

    var p = pool();
    if (!p.length) { showExhausted(); renderCounter(); return; }

    var picked = p[randInt(p.length)];
    state.called.push(picked);
    elName.className = "name hit";
    elName.textContent = picked;
    var left = state.names.length - state.called.length;
    setHint(left > 0 ? "还剩 " + left + " 位同学没被点到" : "本轮已点完，点「重置本轮」再来一轮");
    renderCounter();
    save();
  }

  function toggle() {
    if (state.rolling) stopRolling(); else startRolling();
  }

  function resetRound() {
    clearInterval(state.timer);
    state.timer = null;
    state.rolling = false;
    elMain.textContent = "开始点名";
    elMain.classList.remove("stop");
    disarmReset();
    state.called = [];
    renderCounter();
    showIdle();
    save();
  }

  function armReset() {
    resetArmed = true;
    elReset.classList.add("armed");
    elReset.textContent = "再点一次，清空本轮（" + state.called.length + " 人）";
    clearTimeout(resetTimer);
    resetTimer = setTimeout(disarmReset, 4000);   // 4 秒内没再点就收回
  }
  function disarmReset() {
    resetArmed = false;
    clearTimeout(resetTimer);
    elReset.classList.remove("armed");
    elReset.textContent = "重置本轮";
  }

  /* ---------- 名单弹窗 ---------- */
  function openEditor() {
    if (state.rolling) stopRolling();
    elInpTitle.value = state.title;
    elNames.value = state.names.join("\n");
    elMask.classList.remove("hidden");
    elNames.focus();
    // 坑：直接 focus 会把光标甩到文末，文本框自动滚到最后几行，
    // 老师一打开只看到 36~45 号，会以为名单丢了。强制回到开头。
    elNames.setSelectionRange(0, 0);
    elNames.scrollTop = 0;
  }
  function closeEditor() { elMask.classList.add("hidden"); }

  function saveEditor() {
    var lines = elNames.value.split(/\r?\n/)
      .map(function (s) { return s.replace(/^\s+|\s+$/g, ""); })
      .filter(function (s) { return s.length > 0; });
    // 去重，保留首次出现顺序
    var seen = {}, uniq = [];
    lines.forEach(function (n) {
      if (!seen[n]) { seen[n] = true; uniq.push(n); }
    });
    if (!uniq.length) { alert("名单不能为空，至少写一个名字。"); return; }
    state.names = uniq;
    state.title = (elInpTitle.value || "").replace(/^\s+|\s+$/g, "") || DEFAULT_TITLE;
    state.called = [];
    closeEditor();
    renderCounter();
    showIdle();
    save();
  }

  /* ---------- 事件 ---------- */
  elMain.addEventListener("click", toggle);
  elReset.addEventListener("click", function () {
    if (state.rolling) { setHint("先按一下空格，把滚动停下来再重置"); return; }
    if (!state.called.length) { setHint("本轮还没点过人，不用重置"); return; }
    if (!resetArmed) { armReset(); return; }
    disarmReset();
    resetRound();
    setHint("已重置，全班重新参与点名");
  });
  $("btnEdit").addEventListener("click", openEditor);
  $("btnCancel").addEventListener("click", closeEditor);
  $("btnSave").addEventListener("click", saveEditor);
  elMask.addEventListener("click", function (e) { if (e.target === elMask) closeEditor(); });

  document.addEventListener("keydown", function (e) {
    if (!elMask.classList.contains("hidden")) {
      if (e.key === "Escape") closeEditor();
      return;
    }
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      toggle();
    }
  });

  /* ---------- 一键全屏（投屏用，F11 在部分投影/浏览器里不灵） ---------- */
  elFull.addEventListener("click", function () {
    var d = document, root = d.documentElement;
    var inFull = d.fullscreenElement || d.webkitFullscreenElement;
    try {
      if (inFull) {
        if (d.exitFullscreen) d.exitFullscreen();
        else if (d.webkitExitFullscreen) d.webkitExitFullscreen();
      } else {
        var req = root.requestFullscreen || root.webkitRequestFullscreen;
        if (!req) throw new Error("no fullscreen");
        var p = req.call(root);
        if (p && p.catch) p.catch(function () { setHint("浏览器拦住了全屏，请按 F11"); });
      }
    } catch (err) {
      setHint("这个浏览器不支持按钮全屏，请按 F11");
    }
  });
  document.addEventListener("fullscreenchange", function () {
    elFull.textContent = document.fullscreenElement ? "退出全屏" : "全屏投屏";
  });

  /* ---------- 启动 ---------- */
  load();
  renderCounter();
  if (state.called.length) {
    elName.className = "name hit";
    elName.textContent = state.called[state.called.length - 1];
    var left = state.names.length - state.called.length;
    setHint(left > 0 ? "还剩 " + left + " 位同学没被点到" : "本轮已点完，点「重置本轮」再来一轮");
  } else {
    showIdle();
  }
})();
</script>
</body>
</html>
